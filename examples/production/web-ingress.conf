# Production Web Ingress example. Replace paths, hosts, and ServiceIds before use.
# Secrets stay in token_file (mode 0600), not in this file.
# The public hostname is a locator, not a credential.

listen = 0.0.0.0:443
broker = broker.example.com:8443
token_file = /etc/thirp/web-ingress.token
tls_ca = /etc/thirp/broker-ca.pem
tls_cert = /etc/thirp/web-ingress-fullchain.pem
tls_key = /etc/thirp/web-ingress-key.pem
route = portfolio-k7m4x2.web.example.com=acme/site-17/portfolio-ui:http
# route = secure-k9p3.web.example.com=acme/site-17/secure-ui:tls_passthrough
max_connections = 4096
max_connections_per_ip = 64
max_client_hello_bytes = 65536
client_hello_timeout = 10
broker_dial_timeout = 10
idle_timeout = 300
shutdown_grace = 15
metrics_listen = 127.0.0.1:9190
log_level = info
