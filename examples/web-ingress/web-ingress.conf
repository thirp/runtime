# Local five-terminal Web Ingress demo. Run from the repository root.

listen = 127.0.0.1:9443
broker = 127.0.0.1:8443
token_file = examples/web-ingress/web-ingress.token
tls_ca = examples/web-ingress/broker.crt
tls_cert = examples/web-ingress/web-ingress.crt
tls_key = examples/web-ingress/web-ingress.key
route = portfolio.demo.test=demo/portfolio:http
metrics_listen = 127.0.0.1:9190
log_level = info
