# Local five-terminal Web Ingress demo. Run from the repository root.
# These secrets and certificates are for loopback only. Do not use them on a public host.

listen = 127.0.0.1:8443
tls_cert = examples/web-ingress/broker.crt
tls_key = examples/web-ingress/broker.key
policy_mode = production
token_file = examples/web-ingress/broker.tokens
org_namespace = demo=demo/*
allow_register = demo-agent=demo/portfolio
allow_connect = demo-ingress=demo/portfolio
log_level = info
